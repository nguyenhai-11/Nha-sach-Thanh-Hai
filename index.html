
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Nhà Sách Thanh Hải | Thế giới tri thức</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Nhà Sách Thanh Hải - Khám phá thế giới sách và tri thức.">

  <!-- Giao diện Docsify -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">

  <style>
    :root {
      --theme-color: #1764c0;
      --primary: #1764c0;
      --dark: #103a68;
      --background: #f3f7fc;
    }

    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: var(--background);
      color: #24354b;
    }

    /* Thanh thương hiệu */
    .brand-header {
      background: linear-gradient(110deg, #103a68, #2587df);
      color: white;
      text-align: center;
      padding: 30px 15px;
    }

    .brand-header h1 {
      font-size: 30px;
      font-weight: 800;
      margin: 0 0 10px;
      color: white;
    }

    .brand-header p {
      margin: 0;
      font-size: 15px;
      color: #e6f2ff;
    }

    /* Thanh menu */
    .top-nav {
      background: white;
      padding: 15px 20px;
      text-align: center;
      box-shadow: 0 3px 12px #00000010;
    }

    .top-nav a {
      margin: 8px 14px;
      text-decoration: none;
      color: #1764c0;
      font-weight: 600;
      display: inline-block;
    }

    .top-nav a:hover {
      color: #f59e0b;
    }

    /* Sidebar */
    .sidebar {
      background: #ffffff;
      border-right: 1px solid #e0e9f5;
    }

    .sidebar-nav {
      padding: 10px;
    }

    .sidebar-nav a {
      border-radius: 7px;
      transition: all 0.2s;
    }

    .sidebar-nav a:hover {
      background: #edf5ff;
      color: #1764c0;
    }

    .sidebar .search {
      padding: 18px 12px;
    }

    .sidebar .search input {
      border-radius: 12px;
      padding: 11px;
      background: #f5f9ff;
      border: 1px solid #d7e5f5;
    }

    /* Nội dung */
    .content {
      padding-top: 30px;
    }

    .markdown-section {
      background: white;
      padding: 32px;
      border-radius: 14px;
      box-shadow: 0 5px 24px #173d6810;
      max-width: 950px;
    }

    .markdown-section h1,
    .markdown-section h2 {
      color: #103a68;
      font-weight: 750;
    }

    .markdown-section h2 {
      border-bottom: 2px solid #e5effa;
      padding-bottom: 12px;
    }

    .markdown-section img {
      border-radius: 12px;
      max-width: 100%;
      box-shadow: 0 4px 15px #00000015;
    }

    .markdown-section table {
      display: table;
      width: 100%;
      border-collapse: collapse;
    }

    .markdown-section tr:nth-child(even) {
      background: #f3f8ff;
    }

    /* Nút liên kết */
    .markdown-section a {
      color: #1764c0;
      font-weight: 500;
    }

    .markdown-section a:hover {
      color: #f59e0b;
    }

    .markdown-section blockquote {
      border-left: 5px solid #2587df;
      background: #eff7ff;
      padding: 14px 20px;
      border-radius: 6px;
    }

    /* Chân trang */
    .site-footer {
      text-align: center;
      margin-top: 35px;
      padding: 24px 15px;
      color: #65758c;
      border-top: 1px solid #e0e9f5;
      font-size: 13px;
    }

    /* Điện thoại */
    @media (max-width: 768px) {
      .brand-header h1 {
        font-size: 23px;
      }

      .brand-header {
        padding: 22px 12px;
      }

      .top-nav a {
        margin: 5px 8px;
        font-size: 13px;
      }

      .markdown-section {
        padding: 18px;
      }

      .content {
        padding-top: 10px;
      }
    }
  </style>
</head>

<body>

  <!-- Tên thương hiệu -->
  <header class="brand-header">
    <h1>📚 NHÀ SÁCH THANH HẢI</h1>
    <p>Khám phá tri thức - Nuôi dưỡng tương lai</p>
  </header>

  <!-- Menu -->
  <nav class="top-nav">
    <a href="#/">🏠 Trang chủ</a>
    <a href="#/?id=danh-muc-sach">📖 Danh mục sách</a>
    <a href="#/?id=gioi-thieu">⭐ Giới thiệu</a>
    <a href="#/?id=lien-he">☎️ Liên hệ</a>
  </nav>

  <!-- Docsify hiển thị README.md -->
  <div id="app">📖 Đang tải Nhà Sách Thanh Hải...</div>

  <script>
    window.$docsify = {
      name: "📚 Nhà Sách Thanh Hải",
      repo: "",
      homepage: "README.md",
      loadSidebar: true,
      auto2top: true,
      subMaxLevel: 3,
      maxLevel: 3,

      search: {
        placeholder: "🔎 Tìm kiếm sách...",
        noData: "Không tìm thấy nội dung phù hợp.",
        depth: 4,
        hideOtherSidebarContent: false
      },

      pagination: {
        previousText: "Trang trước",
        nextText: "Trang tiếp theo"
      },

      plugins: [
        function(hook) {
          hook.afterEach(function(html) {
            return html +
              '<footer class="site-footer">' +
              '© 2026 Nhà Sách Thanh Hải' +
              ' | Kết nối tri thức - Lan tỏa văn hóa đọc' +
              '</footer>';
          });
        }
      ]
    };
  </script>

  <!-- Docsify -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>

  <!-- Tìm kiếm -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>

  <!-- Sao chép mã -->
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2/dist/docsify-copy-code.min.js"></script>

  <!-- Phân trang -->
  <script src="https://cdn.jsdelivr.net/npm/docsify-pagination@2/dist/docsify-pagination.min.js"></script>

</body>
</html>
